<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #111111;
    }

    ul {
      list-style: none;
      text-align: center;
    }

    li {
      font-size: 3rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <ul>
    <li>Edgar</li>
    <li>Rita</li>
    <li>Ryan</li>
    <li>Ellen</li>
  </ul>
</body>
</html>
